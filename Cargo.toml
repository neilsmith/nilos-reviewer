[package]
name = "nilos-reviewer"
version = "0.2.4"
edition = "2021"
license = "MIT"

[dependencies]
self_update = "=1.3.2"
rune = { git = "https://github.com/anomalyco/rune", rev = "533a5e1ea815f69773b5c50f269fd514706d32e0" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "533a5e1ea815f69773b5c50f269fd514706d32e0", features = ["markdown"] }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "533a5e1ea815f69773b5c50f269fd514706d32e0" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "warn"

[workspace]
