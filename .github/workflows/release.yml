name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb-xkb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-randr0-dev libxcb-keysyms1-dev \
            libasound2-dev libvulkan-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          asset="nilos-reviewer-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" nilos-reviewer
          mkdir -p out
          mv "$asset" out/
          if command -v sha256sum >/dev/null; then
            (cd out && sha256sum "$asset" > "$asset.sha256")
          else
            (cd out && shasum -a 256 "$asset" > "$asset.sha256")
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: ${{ github.ref_name }}
